
<style>
  .form-wrap { max-width: 600px; margin: 0 auto; padding: 1.5rem 0; font-family: var(--font-serif); }
  .form-header { margin-bottom: 2rem; border-bottom: 0.5px solid var(--color-border-tertiary); padding-bottom: 1rem; }
  .form-title { font-size: 22px; font-weight: 500; color: var(--color-text-primary); margin: 0 0 4px; }
  .form-sub { font-size: 13px; color: var(--color-text-secondary); margin: 0; font-family: var(--font-sans); }
  .field { margin-bottom: 1.5rem; }
  .field label { display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 6px; font-family: var(--font-sans); }
  .field input, .field textarea, .field select { width: 100%; font-family: var(--font-sans); font-size: 14px; box-sizing: border-box; }
  .field textarea { resize: vertical; min-height: 72px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .submit-btn { font-family: var(--font-sans); font-size: 13px; padding: 8px 20px; cursor: pointer; margin-top: 0.5rem; }
  .divider { border: none; border-top: 0.5px solid var(--color-border-tertiary); margin: 1.5rem 0; }
</style>

<div class="form-wrap">
  <div class="form-header">
    <p class="form-title">pH. source — lead submission</p>
    <p class="form-sub">Submit a potential feature. Keep it tight. SK will review and greenlight.</p>
  </div>

  <div class="field">
    <label>Subject / name</label>
    <input type="text" placeholder="Who or what is this?" />
  </div>

  <div class="field-row">
    <div class="field">
      <label>Category</label>
      <select>
        <option value="">Select one</option>
        <option>Visual art</option>
        <option>Music</option>
        <option>Fashion / design</option>
        <option>Architecture</option>
        <option>Literature / poetry</option>
        <option>Cultural moment</option>
        <option>Other</option>
      </select>
    </div>
    <div class="field">
      <label>Where did you find this?</label>
      <input type="text" placeholder="Instagram, exhibition, word of mouth..." />
    </div>
  </div>

  <div class="field">
    <label>Why does this matter right now?</label>
    <textarea placeholder="1–3 sentences. What's the cultural moment? Why now?"></textarea>
  </div>

  <div class="field">
    <label>Why is this pH. source?</label>
    <textarea placeholder="What makes this underground, ahead of the curve, or worth obsessing over?"></textarea>
  </div>

  <hr class="divider" />

  <div class="field">
    <label>Link or reference</label>
    <input type="text" placeholder="Instagram, website, Spotify, gallery page..." />
  </div>

  <div class="field">
    <label>Urgency</label>
    <select>
      <option value="">How time-sensitive is this?</option>
      <option>Evergreen — no rush</option>
      <option>Timely — within the month</option>
      <option>Urgent — happening now</option>
    </select>
  </div>

  <div class="field">
    <label>Submitted by</label>
    <input type="text" placeholder="Your name" />
  </div>

  <button class="submit-btn" onclick="sendPrompt('I submitted a lead for pH. source')">Submit for review ↗</button>
</div>
